[global]
   server string = devbox
   security = user
   # Tailnet-only access is enforced by ufw (445/139 allowed only on tailscale0, eth0
   # blocked by default-deny) — smbd binds all interfaces because binding a TUN iface
   # (tailscale0, no broadcast) by name/IP is unreliable across smbd versions.
   server min protocol = SMB3

[dev]
   path = /srv/dev
   browseable = yes
   read only = no
   valid users = @sudo root
   force user = root
