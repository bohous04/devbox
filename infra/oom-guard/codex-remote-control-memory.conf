# Drop-in for codex-remote-control.service (installed by infra/setup.sh).
# On 30 Sep 2026 the shared Codex app-server took 13.4 GB and helped push the server into OOM.
# MemoryHigh throttles it first (reclaim), MemoryMax then kills it only within its own cgroup;
# Restart=on-failure brings it back up.
[Service]
MemoryHigh=10G
MemoryMax=12G
MemorySwapMax=0
