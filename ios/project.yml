name: DevboxApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.20.0"

targets:
  DevboxApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevboxApp
      - path: Shared
    dependencies:
      - package: SwiftTerm
      - target: DevboxLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.devbox
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DevboxApp/DevboxApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "22"
        # aps-environment in entitlements and the value used for registering Live Activity tokens
        # (`AgentLiveActivityManager.apnsEnvironment` → devd sends to sandbox/production APNs).
        APS_ENVIRONMENT: development
      configs:
        # App Store archives (Stage H1, task 31) need a distribution signature. Automatic
        # signing via the ASC API key hits Apple's "cloud-managed distribution certificate"
        # gate (a separate permission outside the regular ASC roles) — see task-H1-report.md. Fix:
        # a manual distribution cert + App Store profile (minted directly via the ASC REST API), and
        # manual signing only for the Release config, so Debug keeps the convenient Automatic.
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: Generated-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        # The app uses only standard HTTPS/TLS (exempt) — without this key every
        # TestFlight build has to get export compliance set manually via the ASC API, otherwise it sits as
        # "Missing Compliance" and is not offered to testers (builds 1–3 were handled via the API).
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # The server sends agent state changes more often than the default Live Activity budget.
        NSSupportsLiveActivitiesFrequentUpdates: true
        DevboxAPNSEnvironment: "$(APS_ENVIRONMENT)"
        CFBundleURLTypes:
          - CFBundleURLName: com.example.devbox.session
            CFBundleURLSchemes:
              - devbox
        # Vault unlock (Stage G, task 30) reads `vaultPassphrase` from Keychain with access control
        # `.biometryCurrentSet` (see KeychainStore), and SSH key approval goes through LAContext
        # (see Biometrics.swift) — without this key the app would crash on a real device at the
        # first biometric prompt (Face ID requires a usage description).
        NSFaceIDUsageDescription: "Face ID confirms SSH key approvals and unlocks the vault without typing the passphrase."
        # ATS blocks plain HTTP by default. The tailnet path (see AppModel/DevdClient) goes to a
        # bare IP without TLS (Tailscale certificates are not easy for the app to verify) — instead of
        # a blanket NSAllowsArbitraryLoads, only a narrow exception for this one devbox IP.
        # 100.64.0.10 is a placeholder: put your devd's tailnet IP here (see docs/ios.md).
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.64.0.10:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false

  DevboxLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevboxLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.devbox.live-activity
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # App Group `group.com.example.devbox` — the widget reads the last state written by the app
        # (`SharedActivityStore`). The extension has no network access and no credentials.
        CODE_SIGN_ENTITLEMENTS: DevboxLiveActivity/DevboxLiveActivity.entitlements
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "22"
    info:
      path: DevboxLiveActivity-Info.plist
      properties:
        CFBundleDisplayName: Devbox
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DevboxAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevboxAppTests
      # The thread view cases the dashboard's threadView.test.ts runs too (ThreadStoreTests).
      - path: ../shared/fixtures/thread-events.json
        buildPhase: resources
      # The chat tables ChatSwitch.swift copies (ChatSwitchTests; dashboard/src/chatTables.test.ts keeps it current).
      - path: ../shared/fixtures/chat-tables.json
        buildPhase: resources
      # Bridge housekeeping notices the thread leaves out (ThreadStoreTests; dashboard/src/workGroups.test.ts).
      - path: ../shared/fixtures/housekeeping-notices.json
        buildPhase: resources
      # The thread title rule's cases (ChatLayoutTests; dashboard/src/threadTitle.test.ts runs them too).
      - path: ../shared/fixtures/thread-titles.json
        buildPhase: resources
    dependencies:
      - target: DevboxApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  # Live E2E (Task 15) — gated inside the test (XCTSkip without DEVBOX_LIVE_TESTS=1 env), so
  # a normal `xcodebuild test` skips it rather than excluding it from the scheme. devd address in
  # DEVBOX_TAILNET_URL.
  DevboxAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DevboxAppUITests
    dependencies:
      - target: DevboxApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  # The Mac app (Task 2, step 5): inbox sidebar + chat windows, menu bar extra, login item. Same sources as the
  # iOS app minus what only iOS has (Live Activities, the iOS entry point with APNs; the listener notifies on the
  # Mac, S5-R9). `Shared/` is the Live Activity/widget code only, so it is not part of this target.
  # PRODUCT_MODULE_NAME stays DevboxApp so the shared tests' `@testable import DevboxApp` builds for both.
  DevboxMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevboxApp
        excludes:
          - DevboxAppApp.swift
          - DevboxApp.entitlements
          - LiveActivity/**
      - path: DevboxMac
        excludes:
          - Info.plist
          - DevboxMac.entitlements
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: Devbox
        PRODUCT_MODULE_NAME: DevboxApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.devbox.mac
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DevboxMac/DevboxMac.entitlements
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "22"
    info:
      path: DevboxMac/Info.plist
      properties:
        CFBundleDisplayName: Devbox
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        # The listener's thread click opens `devbox://thread/<id>` when LaunchServices finds a handler (S5-R9).
        CFBundleURLTypes:
          - CFBundleURLName: com.example.devbox.mac.thread
            CFBundleURLSchemes:
              - devbox
        # Same narrow exception for the plain-HTTP tailnet path as the iOS app (placeholder IP, see docs/ios.md).
        NSAppTransportSecurity:
          NSExceptionDomains:
            100.64.0.10:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false

  # The shared unit tests run against the Mac app too, minus the tests of iOS-only code.
  DevboxMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevboxAppTests
        excludes:
          - AgentActivityAttributesTests.swift
          - AgentActivityRenderingTests.swift
          - AgentLiveActivityManagerTests.swift
          - LegacySessionActivityCleanupTests.swift
          - SharedActivityStoreTests.swift
          - PushManagerTests.swift
          - ThemeTests.swift
      - path: DevboxMacTests
      - path: ../shared/fixtures/thread-events.json
        buildPhase: resources
      - path: ../shared/fixtures/chat-tables.json
        buildPhase: resources
      - path: ../shared/fixtures/housekeeping-notices.json
        buildPhase: resources
      - path: ../shared/fixtures/thread-titles.json
        buildPhase: resources
    dependencies:
      - target: DevboxMac
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # The app's PRODUCT_NAME is Devbox, not the target name XcodeGen derives the host from.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Devbox.app/Contents/MacOS/Devbox"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DevboxApp:
    build:
      targets:
        DevboxApp: all
        DevboxAppTests: [test]
        DevboxAppUITests: [test]
    test:
      targets:
        - DevboxAppTests
        - DevboxAppUITests
    run:
      config: Debug
  DevboxMac:
    build:
      targets:
        DevboxMac: all
        DevboxMacTests: [test]
    test:
      targets:
        - DevboxMacTests
    run:
      config: Debug
