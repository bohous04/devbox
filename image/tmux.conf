set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
# let Claude Code see terminal focus in/out
set -g focus-events on
# let the vendored warp-hooks OSC 777 status sequences reach the outer terminal
# (Warp) instead of being swallowed by tmux — they self-wrap in the passthrough
# envelope when $TMUX is set
set -g allow-passthrough on
# forward the active pane's title out to the enclosing terminal so Warp auto-renames
# the tab. A manual session label (@devd_label, set by `dev` — see cli/src/attach.ts
# labelSetCmd) takes precedence over the live Claude title, so a renamed session has
# a stable name in Warp. Otherwise use the nickname of the whole devbox session,
# which the CLI loads from the API on attach and stores in @devd_session_name.
set -g set-titles on
set -g set-titles-string "#{?@devd_label,#{@devd_label},#{?@devd_session_name,#{@devd_session_name},#{?@devd_auto_title,#{@devd_auto_title},#{pane_title}}}}"

# Ctrl+V (no prefix) = clipboard bridge also for harnesses without xclip. cc reads the image
# itself (xclip shim), but Codex and Grok Build read the clipboard via arboard
# (X11/Wayland directly) and there is no display in the container → the script stages the image/file
# for them into the shared /inbox and inserts the path; for everyone else (cc, bash, vim…)
# it just forwards C-v. Details in image/devbox-ctrlv.
bind-key -n C-v run-shell '/usr/local/bin/devbox-ctrlv "#{pane_id}"'

# F9 (no prefix) = leave: detaches this client and replaces its process with `exit 42`, which
# `dev` on the mac (attachLoop) recognizes and shows the exit menu (Back / End / Just detach).
# Per client — F9 in main-2 does not drop a client attached to main. The CLI also self-heals it on
# every attach (EXIT_KEY in cli/src/attach.ts), so it works on older containers too.
bind-key -n F9 detach-client -E "exit 42"

# Status bar (green default): on the left the session identity (the entrypoint overwrites it with
# project/repo per DEVD_PROJECT/REPO; fallback #S = tmux session name), on the right
# git branch + count of changed /workspace files via a helper, plus the time.
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 50
set -g status-left " #S | "
set -g status-right "#(/usr/local/bin/devbox-tmux-status)%H:%M "
# separator between terminal windows (the default is just a space)
set -g window-status-separator " | "
